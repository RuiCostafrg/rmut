name: Stryker.NET conformance

on:
  pull_request:
    paths:
      - '.github/workflows/stryker-conformance.yml'
      - 'benchmarks/**'
      - 'fixtures/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workload: [shared-operators, switched-assembly, relational-gap, no-coverage-gap, operator-exclusion-gap]
        include:
          - workload: incremental-operators
            scenario: unchanged
          - workload: incremental-operators
            scenario: test-only
          - workload: incremental-operators
            scenario: production
    env:
      WORKLOAD: ${{ matrix.workload }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Verify harness logic
        run: python3 -B -m unittest discover -s benchmarks -v
      - name: Install pinned tools
        run: |
          dotnet tool install dotnet-stryker --version 5.1.0 --tool-path "$RUNNER_TEMP/stryker"
          dotnet pack src/Rmut.Cli --configuration Release -p:PackageVersion=0.0.1-conformance \
            --output "$RUNNER_TEMP/feed"
          dotnet tool install Rmut --version 0.0.1-conformance --tool-path "$RUNNER_TEMP/rmut" \
            --add-source "$RUNNER_TEMP/feed"
      - name: Compare incremental and fresh mutant reports
        if: matrix.scenario
        run: |
          patch=()
          if [[ "$SCENARIO" != unchanged ]]; then
            patch=(--incremental-patch "benchmarks/incremental/$SCENARIO.patch")
          fi
          status=0
          python3 -B benchmarks/run.py compare "$WORKLOAD" --scenario incremental "${patch[@]}" \
            --stryker "$RUNNER_TEMP/stryker/dotnet-stryker" --rmut "$RUNNER_TEMP/rmut/rmut" \
            --output "$RUNNER_TEMP/result" --timeout 300 || status=$?
          python3 - "$RUNNER_TEMP/result/pair-01/pair.json" "$SCENARIO" "$status" <<'PY'
          import json
          import sys

          path, scenario, status = sys.argv[1:]
          with open(path) as stream:
              pair = json.load(stream)
          stryker, rmut = pair["stryker"], pair["rmut"]
          for tool in (stryker, rmut):
              assert tool.get("exit_code") == 0 and "error" not in tool, tool
              assert not tool["fresh_differential"]["unfinished"], tool["fresh_differential"]

          def outcomes(sample):
              return {tuple(row["identity"]): row["outcome"] for row in sample["mutants"]}

          assert outcomes(stryker["seed"]) == outcomes(rmut["seed"])
          assert outcomes(stryker["fresh"]) == outcomes(rmut["fresh"])
          assert not any(rmut["fresh_differential"].values())
          assert stryker["baseline_loaded"] and stryker["reused_outcomes"] == 0

          diff = rmut["seed_differential"]
          if scenario == "test-only":
              [changed] = diff["outcome_mismatches"]
              assert (changed["stryker"]["outcome"], changed["rmut"]["outcome"]) == ("survived", "killed"), diff
              assert not diff["stryker_only"] and not diff["rmut_only"], diff
          elif scenario == "production":
              assert len(diff["stryker_only"]) == len(diff["rmut_only"]) == 1, diff
          else:
              assert not any(diff.values()), diff

          diff = pair["differential"]
          assert not diff["stryker_only"] and not diff["rmut_only"] and not diff["unfinished"], diff
          for row in diff["outcome_mismatches"]:
              assert row["stryker"] == {
                  "outcome": "ignored", "reason": "Mutant not changed compared to target commit",
              }, diff
          if scenario == "unchanged":
              assert len(diff["outcome_mismatches"]) == len(rmut["mutants"]), diff
          if scenario == "production":
              assert not any(diff.values()), diff
          assert status == ("1" if diff["outcome_mismatches"] else "0"), diff
          PY
      - name: Compare mutant reports
        if: ${{ !matrix.scenario }}
        run: |
          results="$RUNNER_TEMP/result"
          status=0
          python3 -B benchmarks/run.py compare "$WORKLOAD" \
            --stryker "$RUNNER_TEMP/stryker/dotnet-stryker" --rmut "$RUNNER_TEMP/rmut/rmut" \
            --output "$results" --timeout 300 || status=$?
          python3 - "$results/pair-01/pair.json" "$WORKLOAD" "$status" <<'PY'
          import json
          import sys

          path, workload, status = sys.argv[1:]
          with open(path) as stream:
              pair = json.load(stream)
          for tool in ("stryker", "rmut"):
              assert pair[tool].get("exit_code") == 0 and "error" not in pair[tool], pair[tool]
          diff = pair["differential"]
          assert not diff["rmut_only"] and not diff["unfinished"], diff

          if workload in ("shared-operators", "switched-assembly"):
              assert status == "0" and pair["equivalent"], diff
              assert sorted(row["outcome"] for row in pair["rmut"]["mutants"]) == [
                  "killed", "killed", "killed", "killed", "survived",
              ], pair["rmut"]["mutants"]
          elif workload == "relational-gap":
              assert status == "1" and not pair["equivalent"], diff
              assert len(diff["stryker_only"]) == 1 and diff["stryker_only"][0][2:] == [">", "<"], diff
              assert not diff["outcome_mismatches"], diff
          else:
              assert status == "1" and not pair["equivalent"], diff
              assert not diff["stryker_only"] and len(diff["outcome_mismatches"]) == 1, diff
              mismatch = diff["outcome_mismatches"][0]
              expected = ("noCoverage", "survived") if workload == "no-coverage-gap" else ("ignored", "killed")
              assert (mismatch["stryker"]["outcome"], mismatch["rmut"]["outcome"]) == expected, diff
          PY
      - name: Save conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-${{ matrix.workload }}${{ matrix.scenario && format('-{0}', matrix.scenario) || '' }}
          path: |
            ${{ runner.temp }}/result/*.json
            ${{ runner.temp }}/result/pair-*/pair.json
            ${{ runner.temp }}/result/pair-*/*/*.log
            ${{ runner.temp }}/result/pair-*/*/*.json
            ${{ runner.temp }}/result/pair-*/stryker/reports/*.json
            ${{ runner.temp }}/result/pair-*/*/seed/*.json
            ${{ runner.temp }}/result/pair-*/*/seed/*.log
            ${{ runner.temp }}/result/pair-*/*/fresh/*.json
            ${{ runner.temp }}/result/pair-*/*/fresh/*.log
            ${{ runner.temp }}/result/pair-*/stryker/fresh/reports/*.json
          if-no-files-found: ignore
