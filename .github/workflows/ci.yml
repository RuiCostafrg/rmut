name: Build and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Audit direct and transitive dependencies
        run: |
          for project in src/*/*.csproj tests/*/*.csproj fixtures/Consumer/*/*.csproj; do
            dotnet restore "$project" --force --no-http-cache \
              -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
              '-warnaserror:NU1900;NU1901;NU1902;NU1903;NU1904;NU1905'
          done

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Rmut.Engine.Tests --configuration Release
      - run: dotnet test tests/Rmut.Cli.Tests --configuration Release
      - name: Pack and smoke-test the installed tool
        run: |
          dotnet pack src/Rmut.Cli --configuration Release --no-build \
            -p:PackageVersion=0.0.0-ci --output "$RUNNER_TEMP/rmut-feed"
          bash scripts/smoke-package.sh "$RUNNER_TEMP/rmut-feed" 0.0.0-ci

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Collect production line coverage
        run: |
          dotnet test tests/Rmut.Engine.Tests --configuration Release --collect 'XPlat Code Coverage' \
            --results-directory "$RUNNER_TEMP/coverage/engine"
          dotnet test tests/Rmut.Cli.Tests --configuration Release --collect 'XPlat Code Coverage' \
            --results-directory "$RUNNER_TEMP/coverage/cli"
      - name: Require the production coverage floors
        shell: bash
        run: python3 scripts/check-coverage.py "$RUNNER_TEMP/coverage" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dotnet-coverage
          path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
          retention-days: 14

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Install the pinned Stryker.NET comparator
        run: dotnet tool install dotnet-stryker --version 5.1.0 --tool-path "$RUNNER_TEMP/stryker"
      - name: Mutate the managed reference engine
        working-directory: tests/Rmut.Engine.Tests
        run: |
          "$RUNNER_TEMP/stryker/dotnet-stryker" --project Rmut.Engine.csproj \
            --reporter json --break-at 70
          jq -e 'any(.files[].mutants[]; .status == "Killed")' \
            StrykerOutput/*/reports/mutation-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dotnet-mutation
          path: tests/Rmut.Engine.Tests/StrykerOutput/**/mutation-report.json
          retention-days: 14

  verify:
    needs: [audit, workflow-lint, platforms, coverage, mutation]
    if: always()
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      package-artifact: ${{ steps.package.outputs.artifact-id }}
      package-version: ${{ steps.version.outputs.value }}
    steps:
      - name: Require every CI gate to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'length == 5 and all(. == "success")' <<< "$RESULTS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.ref_type == 'tag'
        with:
          persist-credentials: false
      - name: Confirm release authorization and successful main CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          test "$ACTOR_ID" = 35194998
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq '.status' | grep -Ex 'ahead|identical'
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$sha&status=success" --jq '.total_count' | grep -Ex '[1-9][0-9]*'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: github.ref_type == 'tag'
        with:
          dotnet-version: 10.0.x
      - name: Determine package version
        if: github.ref_type == 'tag'
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag of the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Pack and smoke-test the release package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet pack src/Rmut.Cli/Rmut.Cli.csproj --configuration Release -p:ContinuousIntegrationBuild=true \
            -p:PackageVersion="$PACKAGE_VERSION" --output "$RUNNER_TEMP/rmut-feed"
          bash scripts/smoke-package.sh "$RUNNER_TEMP/rmut-feed" "$PACKAGE_VERSION"
      - name: Save the verified package
        id: package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rmut-package
          path: ${{ runner.temp }}/rmut-feed/Rmut.${{ steps.version.outputs.value }}.nupkg
          if-no-files-found: error

  provenance:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.package-artifact }}
          path: packages
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/Rmut.${{ needs.verify.outputs.package-version }}.nupkg

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.package-artifact }}
          path: packages
      - name: Sign in to NuGet.org
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the verified package
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
          NUGET_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/Rmut.$PACKAGE_VERSION.nupkg" \
            --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json

  verify-published:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.package-artifact }}
          path: packages
      - name: Verify provenance, NuGet signature and the installed public package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
        run: |
          original="packages/Rmut.$PACKAGE_VERSION.nupkg"
          gh attestation verify "$original" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          mkdir -p "$RUNNER_TEMP/public-feed"
          published="$RUNNER_TEMP/public-feed/Rmut.$PACKAGE_VERSION.nupkg"
          curl --fail --silent --show-error --location --retry 120 --retry-all-errors \
            --retry-delay 10 --retry-max-time 1200 --max-time 30 \
            "https://api.nuget.org/v3-flatcontainer/rmut/$PACKAGE_VERSION/rmut.$PACKAGE_VERSION.nupkg" \
            --output "$published"
          dotnet nuget verify "$published" --all
          python3 scripts/compare-nuget.py "$original" "$published"
          bash scripts/smoke-package.sh "$RUNNER_TEMP/public-feed" "$PACKAGE_VERSION"
